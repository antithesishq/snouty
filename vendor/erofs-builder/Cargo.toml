[package]
name = "erofs-builder"
version = "0.2.0"
edition = "2021"
description = "EROFS image writer"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["io-util", "fs", "rt-multi-thread", "macros"] }
# snouty: rand is optional and crc32c is gone, so the library pulls in neither.
rand = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = []
clap = ["dep:clap", "dep:rand"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mkfs-sample"
required-features = ["clap"]
