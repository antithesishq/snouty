name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CLICOLOR: 0
  NO_COLOR: "1"
  RUST_BACKTRACE: 1

permissions:
  contents: read
  checks: write

jobs:
  skip-check:
    runs-on: ubuntu-24.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5
        with:
          paths_ignore: '["**.md"]'
  checks:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Spell Check Repo
        uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2
  test:
    runs-on: ${{ matrix.os }}
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    # Safety net so a wedged container op can't hang the runner for hours.
    # macOS gets a bigger budget: it must exceed the sum of its step timeouts
    # below, or it fires first and hides which step stalled.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: docker
            timeout: 20
          - os: ubuntu-latest
            runtime: podman
            timeout: 20
          - os: macos-15-intel
            runtime: podman
            timeout: 35
    env:
      SNOUTY_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Nextest
        uses: taiki-e/install-action@cargo-nextest

      # snouty always drives Docker Compose v2 via the `docker-compose` binary,
      # independent of the image runtime. The matrix exercises that binary
      # against both runtimes: docker on Ubuntu, and podman (which docker-compose
      # reaches over podman's API socket via DOCKER_HOST) on Ubuntu and macOS.
      # Each configure step pins the runtime and ensures `docker-compose` is on
      # PATH.
      - name: Configure Docker (Ubuntu)
        if: matrix.runtime == 'docker' && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo rm -v -f "$(which podman)"
          sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Configure Podman (Ubuntu)
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'ubuntu')
        run: |
          # Remove docker so snouty auto-detects podman; docker-compose then
          # reaches podman over its API socket via DOCKER_HOST.
          sudo rm -v -f "$(which docker)"
          sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          systemctl --user start podman.socket

      - name: Install Podman + docker-compose (macOS)
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
        shell: bash
        timeout-minutes: 8
        run: |
          # Time each portion so we can see where setup spends its time.
          t=$SECONDS
          # podman 6.0.0 dropped Intel macOS support, so `brew install podman`
          # no longer yields a working amd64 binary on this runner. Install the
          # last Intel-capable release (5.8.4) from its macOS pkg instead; still
          # get docker-compose from brew.
          brew install docker-compose
          curl -fsSL -o /tmp/podman-installer.pkg \
            https://github.com/podman-container-tools/podman/releases/download/v5.8.4/podman-installer-macos-amd64.pkg
          sudo installer -pkg /tmp/podman-installer.pkg -target /
          # The pkg installs the CLI under /opt/podman/bin, for this step and
          # every step after it.
          echo "/opt/podman/bin" >> "$GITHUB_PATH"
          export PATH="/opt/podman/bin:$PATH"

          printf '[timing] install: %ss\n' "$(( SECONDS - t ))"
          echo "::notice title=podman install timing::install $(( SECONDS - t ))s"

      # `podman machine init`/`start` have no timeout of their own and sometimes
      # wedge. Its own step bounds that hang and names it; healthy runs take
      # ~5m, so 8m is headroom.
      - name: Provision podman machine (macOS)
        id: podman_machine
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
        shell: bash
        timeout-minutes: 8
        continue-on-error: true
        run: scripts/provision-podman-machine.sh

      # A wedged start clears on a fresh machine, so retry once. A second step
      # gives the retry its own timeout, and no `continue-on-error` here means a
      # second failure fails the job.
      - name: Recreate podman machine after a failed start (macOS)
        if: |
          matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
          && steps.podman_machine.outcome == 'failure'
        shell: bash
        timeout-minutes: 8
        run: |
          echo "::warning title=podman machine retry::provisioning did not finish in time; recreating the machine"
          # The machine may be half-built or unresponsive, and neither teardown
          # step is required to succeed for a fresh init to work.
          podman machine stop || true
          podman machine rm --force || true
          scripts/provision-podman-machine.sh

      - name: Runtime Info
        shell: bash
        run: |
          if [ "${{ matrix.runtime }}" = "docker" ]; then
            docker info
          else
            podman info
          fi
          docker-compose version

      # Cache the k8s-validator image as a tarball. `snouty validate` (k8s) does
      # a `podman run` that implicitly pulls this remote image with no timeout;
      # pulling it from Docker Hub costs ~2m and, under the parallel spec run,
      # several tests can saturate the single VM's gvproxy network proxy at once
      # and that pull wedges indefinitely. Caching the tarball turns the fetch
      # into a local `podman load` — fast and offline.
      # Bump the key's version suffix when K8S_VALIDATOR_IMAGE changes.
      - name: Cache k8s-validator image (macOS)
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/k8s-validator.tar
          key: k8s-validator-image-1.0.0

      - name: Load or pull k8s-validator image (macOS)
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
        run: |
          if [ -f ~/k8s-validator.tar ]; then
            echo "Loading k8s-validator from cache"
            podman load -i ~/k8s-validator.tar
          else
            echo "Pulling k8s-validator and saving for cache"
            podman pull docker.io/antithesishq/k8s-validator:1.0.0
            podman save docker.io/antithesishq/k8s-validator:1.0.0 -o ~/k8s-validator.tar
          fi

      # Pre-fetch every remote image and start the registry tests push to, so a
      # slow or rate-limited pull fails here rather than inside a test.
      - name: Set up test images and registry
        shell: bash
        timeout-minutes: 10
        run: scripts/setup-test-images.sh "${{ matrix.runtime }}"

      - name: Test
        run: cargo nextest run
  # The read-only spec suite against a real tenant. `SNOUTY_STAGING=1` turns the
  # `mock-*` directives into pass-throughs that hand snouty the real credentials,
  # skips the `[!staging]` lines that assert on mock fixtures, and stops each
  # mutating file at its `[staging] skip`.
  #
  # This is the only check that can notice `src/openapi.json` drifting from what
  # the API actually returns: the mock's fixtures are written from the spec, so
  # mock and spec agree by construction even when both are wrong. It also covers
  # real bearer auth, real cursor pagination, and the release-version gating.
  #
  # Runs alongside `test` rather than after it, and finishes in a few minutes
  # against a matrix leg that can take fifteen, so it does not move the critical
  # path.
  staging:
    runs-on: ubuntu-latest
    needs: skip-check
    # Secrets are not exposed to workflows triggered by a fork's pull request,
    # so this cannot run there. `pull_request_target` would supply them, but it
    # runs with the base repo's token against the fork's code — a PR that edited
    # a spec file could print the API key. Fork PRs skip the job instead; the
    # spec-shape lints in `test` still run everywhere.
    if: |
      needs.skip-check.outputs.should_skip != 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Nextest
        uses: taiki-e/install-action@cargo-nextest

      # Fail loudly rather than silently passing: once this job gates merges, a
      # missing secret means the check is not running, which is worse than red.
      - name: Require tenant credentials
        env:
          TENANT: ${{ secrets.STAGING_ANTITHESIS_TENANT }}
          API_KEY: ${{ secrets.STAGING_ANTITHESIS_API_KEY }}
        run: |
          if [ -z "$TENANT" ] || [ -z "$API_KEY" ]; then
            echo "STAGING_ANTITHESIS_TENANT and STAGING_ANTITHESIS_API_KEY must be set as repository secrets" >&2
            exit 1
          fi

      - name: Spec tests against staging
        env:
          SNOUTY_STAGING: 1
          ANTITHESIS_TENANT: ${{ secrets.STAGING_ANTITHESIS_TENANT }}
          ANTITHESIS_API_KEY: ${{ secrets.STAGING_ANTITHESIS_API_KEY }}
          # No base URL: snouty resolves https://<tenant>.antithesis.com from the
          # tenant, which is the address this is meant to exercise.
        run: cargo nextest run --test spec spec_tests

  tests-passed:
    runs-on: ubuntu-latest
    needs:
      - skip-check
      - test
      - build-nix
      - staging
    if: always()
    steps:
      - name: Verify test matrix
        run: |
          if [ "${{ needs.skip-check.outputs.should_skip }}" = "true" ]; then
            exit 0
          fi

          # `staging` is skipped on a fork's pull request, where the credentials
          # it needs are not available. That is the one non-success this gate
          # accepts; a failure or cancellation still blocks.
          staging="${{ needs.staging.result }}"

          if [ "${{ needs.test.result }}" = "success" ]; then
            if [ "${{ needs.build-nix.result }}" = "success" ]; then
              if [ "$staging" = "success" ] || [ "$staging" = "skipped" ]; then
                exit 0
              fi
            fi
          fi

          echo "test matrix result: ${{ needs.test.result }}"
          echo "build-nix result: ${{ needs.build-nix.result }}"
          echo "staging result: $staging"
          exit 1
  build-nix:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - uses: samueldr/lix-gha-installer-action@7b7f14d320d6aacfb65bd1ef761566b3b69e474c # v2026-02-22

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - name: Start Podman socket # required for docker-compose
        run: |
          systemctl --user start podman.socket

      # This leg sets no SNOUTY_TEST_RUNTIME, so the suite exercises both
      # engines and both need the images.
      - name: Set up test images and registry
        shell: bash
        timeout-minutes: 10
        run: scripts/setup-test-images.sh podman docker

      - name: Test
        run: nix-shell --run "cargo nextest run"
