# cargo-deny configuration. Run `cargo deny check` locally; CI runs it in the
# `lint` job of .github/workflows/build.yml, including the nightly run.

[advisories]
# Vulnerable, unmaintained, unsound and yanked crates all fail. yanked defaults
# to a warning, so it is set here.
yanked = "deny"
ignore = [
    # unsafe-libyaml is archived. serde_yaml pulls it in, and even the latest
    # progenitor-macro (0.15.1) depends on serde_yaml, so dropping serde_yaml
    # from snouty would not remove it.
    # https://rustsec.org/advisories/RUSTSEC-2024-0449
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no upgrade available; progenitor-macro still requires serde_yaml" },
]

[licenses]
# Every license here is permissive and compatible with snouty's Apache-2.0,
# except MPL-2.0. That one is weak, file-level copyleft: it covers only
# progenitor's own files, which snouty uses unmodified, so it is compatible
# too. Keep the list to what the dependency tree uses.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-root-certs, the Mozilla root store as data, under
    # rustls-platform-verifier on wasm32 only.
    "CDLA-Permissive-2.0",
    # ring and rustls-webpki.
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# A second version of a crate fails, unless it is listed in `skip` below. Each
# entry names the older version, which an upstream crate still requires; none
# has a newer release that would remove it. When an upgrade removes one,
# cargo-deny reports the entry as an unmatched skip, so delete it then.
multiple-versions = "deny"
skip = [
    # cacache 13.1 and ssri 9.2, both the latest, are on miette 5, thiserror 1
    # and base64 0.21.
    { crate = "base64@0.21", reason = "ssri, under cacache" },
    { crate = "thiserror@1", reason = "cacache, ssri and miette 5" },
    { crate = "thiserror-impl@1", reason = "thiserror 1" },
    { crate = "unicode-width@0.1", reason = "miette 5, under cacache" },
    # headers 0.4 and wiremock 0.6 are on base64 0.22; snouty and reqwest are
    # on 0.23.
    { crate = "base64@0.22", reason = "headers and wiremock" },
    # jsonschema, up to 0.60, depends on ahash 0.8, which is on getrandom 0.3.
    # r-efi is getrandom's UEFI backend, so it splits with it.
    { crate = "getrandom@0.3", reason = "ahash 0.8, under jsonschema" },
    { crate = "r-efi@5", reason = "getrandom 0.3" },
    # ring 0.17, the latest, is on getrandom 0.2 and, on Windows only, on
    # windows-sys 0.52.
    { crate = "getrandom@0.2", reason = "ring" },
    { crate = "windows-sys@0.52", reason = "ring, on Windows" },
    { crate = "hashbrown@0.16", reason = "clru 0.6, under gix-pack" },
    # Proc-macro crates are moving from syn 2 to 3. Both run only at build
    # time, so neither reaches the binary.
    { crate = "syn@2", reason = "proc macros not yet on syn 3" },
    # rmcp's server feature is on schemars 1. progenitor 0.15 and typify 0.8,
    # the latest stable releases, are on schemars 0.8 and run only at build
    # time.
    { crate = "schemars@0.8", reason = "progenitor and typify, at build time" },
    { crate = "schemars_derive@0.8", reason = "schemars 0.8" },
    { crate = "serde_derive_internals@0.29", reason = "schemars_derive 0.8" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# allow-registry defaults to crates.io only.
# testscript-rs, a dev-dependency, comes from antithesishq's own repository.
allow-git = ["https://github.com/antithesishq/testscript-rs.git"]
