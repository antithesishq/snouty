[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = true
# Publish the crates to crates.io from CI (.github/workflows/publish-crates.yml)
publish-jobs = ["./publish-crates"]
# Publish -rc.N tags to crates.io as well as stable tags
publish-prereleases = true
# Produce build provenance attestations for the released artifacts
github-attestations = true

# dist defaults to macos-14, which GitHub retires on 2026-11-02.
# The gnu binaries link against the build runner's glibc, and the dist
# installer requires that version or newer. ubuntu-22.04 has glibc 2.35.
# TODO: Replace ubuntu-22.04 after the 0.8 release. GitHub retires it, with
# brownouts before 2027-04-17 (actions/runner-images#14254).
[dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-15"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-unknown-linux-musl = "ubuntu-22.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-unknown-linux-musl = "ubuntu-22.04"

[dist.dependencies.apt]
musl-tools = { targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"] }
