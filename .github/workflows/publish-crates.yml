# Publishes the crates to crates.io and the npm package to npm, then lists
# `snouty mcp` in the MCP Registry.
#
# `release.yml` (generated by dist) calls this workflow, because
# `dist-workspace.toml` sets `publish-jobs = ["./publish-crates"]`. dist runs it
# only for real releases, after the artifacts build and the GitHub Release
# exists. `publish-prereleases = true` makes it run for `-rc.N` tags as well.
#
# Authentication uses crates.io Trusted Publishing: GitHub mints an OIDC token,
# crates.io exchanges it for a registry token that lives for the job, and the
# repository holds no long-lived `CARGO_REGISTRY_TOKEN` secret. crates.io reads
# the workflow filename from the OIDC `workflow_ref` claim, which names the
# entry-point workflow. Both crates must therefore list `release.yml` — not this
# file — as the workflow in their Trusted Publishing config, and name the
# `release` environment. crates.io attaches a config only to a crate that
# already exists, so a crate with no published version needs one manual
# `cargo publish` before this job can take it over.
#
# npm uses Trusted Publishing too. Its config on the snouty package names
# `release.yml` and the `release` environment, and allows direct publishing. Like crates.io,
# npm attaches a config only to a package that exists, so the first version
# needs one manual `npm publish`.
name: Publish crates

on:
  workflow_call:
    # dist passes the release plan to every publish job. This job does not read
    # it, but the input must be declared for the call to be valid.
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: "ubuntu-24.04"
    # Hold the run here until a reviewer approves it.
    environment: release
    # An explicit bash adds pipefail, so a failed curl fails its pipeline.
    defaults:
      run:
        shell: bash
    # release.yml grants the publish job `id-token: write` and
    # `packages: write`. A called workflow can only narrow that grant, so this
    # job keeps the OIDC permission it needs and drops the rest. `contents`
    # stays unset; the checkout below reads a public repository.
    permissions:
      "id-token": "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job holds secrets, so it restores nothing from the Actions cache.
      - uses: ./.github/actions/setup-tools
        with:
          cache: "false"
          mise-tools: "github:modelcontextprotocol/registry node"
          mise-cache: "false"
      - name: Get a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # snouty-macros goes first. snouty pins it with `=`, so snouty cannot
          # build against the registry until that exact version is in the index.
          # `cargo publish` waits for the index before it returns, so the second
          # crate sees the first one's upload.
          for crate in snouty-macros snouty; do
            version=$(cargo pkgid -p "$crate" | sed 's/.*[@#]//')
            if cargo info --registry crates-io "$crate@$version" > /dev/null 2>&1; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done
      # tests/mcp.rs keeps this version equal to the crate's, so it names the
      # release tag.
      - name: Read server.json
        id: entry
        run: |
          name=$(jq -er .name server.json)
          version=$(jq -er .version server.json)
          package=$(jq -er '[.packages[] | select(.registryType == "npm")] | if length == 1 then .[0].identifier else error("want one npm package") end' server.json)
          {
            echo "name=$name"
            echo "version=$version"
            echo "npm-package=$package"
          } >> "$GITHUB_OUTPUT"
      # dist cannot add mcpName, which the MCP Registry checks, so this job
      # publishes dist's package. Trusted Publishing compares the repository
      # URL to this repository. npm's wrapper starts snouty by its own path,
      # so a docker-credential-snouty alias would not act as the credential
      # helper; a second wrapper runs `snouty docker-credential` instead.
      - name: Publish to npm
        env:
          name: ${{ steps.entry.outputs.name }}
          version: ${{ steps.entry.outputs.version }}
          package: ${{ steps.entry.outputs.npm-package }}
        run: |
          if [ -n "$(npm view "$package@$version" version 2> /dev/null)" ]; then
            echo "$package $version is already on npm"
            exit 0
          fi
          curl -fsSL --retry 3 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$version/snouty-npm-package.tar.gz" | tar xz
          cat > package/run-docker-credential-snouty.js <<'EOF'
          #!/usr/bin/env node
          process.argv.splice(2, 0, "docker-credential");
          require("./binary").run("snouty");
          EOF
          jq --arg name "$name" --arg url "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" '
            .mcpName = $name
            | .repository = {type: "git", url: $url}
            | .bin |= {snouty: .snouty, "docker-credential-snouty": "run-docker-credential-snouty.js"}
          ' package/package.json > package.json
          mv package.json package/package.json
          # A published version cannot be replaced, so check the edit first.
          jq -e '.bin.snouty and .mcpName == env.name' package/package.json > /dev/null
          [ -f "package/$(jq -r '.bin["docker-credential-snouty"]' package/package.json)" ]
          # A prerelease must not become the version that `npm install` picks.
          tag=latest
          case $version in *-*) tag=next ;; esac
          npm publish ./package --access public --tag "$tag"
      # Runs for -rc.N tags too, so an -rc.N becomes the registry's latest
      # version until the stable release. TODO: skip prereleases once the mcp
      # feature is stable. MCP_PRIVATE_KEY is a hex Ed25519 key.
      # Its public half is in the antithesis.com TXT record
      # `v=MCPv1; k=ed25519; p=...`.
      - name: Publish to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
          name: ${{ steps.entry.outputs.name }}
          version: ${{ steps.entry.outputs.version }}
          package: ${{ steps.entry.outputs.npm-package }}
        run: |
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$version?include_deleted=true"; then
            echo "$name $version is already in the MCP Registry"
            exit 0
          fi
          mcp-publisher login dns --domain antithesis.com --private-key "$MCP_PRIVATE_KEY"
          # The registry reads mcpName from npm, which serves a new version
          # after a delay, so wait for it before the one publish.
          for _ in $(seq 20); do
            [ "$(npm view "$package@$version" mcpName 2> /dev/null)" = "$name" ] && break
            sleep 15
          done
          mcp-publisher publish
