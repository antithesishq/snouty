# Options reference:
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

# One pull request a week carries every cargo and github-actions version update.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    # package.nix pins this git dependency's source by hash, which Dependabot
    # does not update, and PR CI does not run the nix build. Bump its commit by
    # hand and update that hash.
    ignore:
      - dependency-name: "testscript-rs"
  # The workflows pin each action to a commit. This entry does not update the
  # tools in mise.toml; AGENTS.md says how to bump those.
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; the local composite actions need their own.
    directories: ["/", "/.github/actions/*"]
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    # Generated workflows. Update their pins through `dist init` and
    # `gh aw compile`; a hand edit breaks dist's check or is overwritten.
    exclude-paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/weekly-audit.lock.yml"
    cooldown:
      default-days: 7
