# Steps that dist's release.yml runs in build-local-artifacts, before it
# installs dist. See github-build-setup in dist-workspace.toml.
# The manylinux images lack the perl modules that the vendored OpenSSL build
# needs. The ubuntu runners have them. The container runs as root, but the
# runner user owns the checkout, so git refuses it unless it is marked safe,
# and build.rs then leaves the commit SHA out of `snouty --version`.
- name: Prepare the manylinux container
  if: ${{ matrix.container }}
  run: |
    dnf install -y perl-IPC-Cmd perl-Time-Piece
    git config --global --add safe.directory "$GITHUB_WORKSPACE"
