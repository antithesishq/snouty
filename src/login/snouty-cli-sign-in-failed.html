<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Snouty CLI sign-in failed</title>
<style>
  /* Antithesis brand fonts. Each stack falls back to a system font, so the
     page still renders if assets.anta.design is unreachable. */
  @font-face {
    font-family: "TT Interphases Pro Variable";
    src: url("https://assets.anta.design/fonts/TT_Interphases_Pro_Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 75% 100%;
    font-display: swap;
  }
  @font-face {
    font-family: Stringer;
    src: url("https://assets.anta.design/fonts/Stringer-Regular-Web.woff2") format("woff2");
    font-weight: 300 400;
    font-display: swap;
  }

  /* Values from Figma "Anta 0.4 — SaaS Web app" › CLI login, failed state
     (desktop 28:7193, mobile 28:7225). They match anta's theme-antithesis.css. */
  :root {
    --sans-serif: "TT Interphases Pro Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: Stringer, ui-serif, Georgia, serif;
    --monospace: ui-monospace, SFMono-Regular, Menlo, monospace;

    --bg-2: #fdfaf8;
    --tile-bg: #f3f0ee;
    --tile-border: #e4ddd8;
    --code-bg: #eeeae7;
    --text-1: #080707;
    --text-3: #665f5b;
    --logo-mark: #f18271;
    --critical: #e56c80;

    /* Figma's "Sign-in Card" glow, anchored to the bottom edge. The mobile
       frame narrows the ellipse; see the max-width query below. */
    --glow-rx: 986px;
    --glow-height: 476px;
    --glow: radial-gradient(
      ellipse var(--glow-rx) var(--glow-height) at 50% 100%,
      color-mix(in oklch, #fff2f0 88%, transparent),
      transparent
    );
  }

  /* Dark values from Figma (desktop 28:7303, mobile 28:7335). */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-2: #170812;
      --tile-bg: #2c1124;
      --tile-border: #442e3d;
      --code-bg: #2c1124;
      --text-1: #eeeae7;
      --text-3: #a398a0;
      --critical: #de455e;

      /* Magenta glow; the frame layers it at 22% × 50% = 11% opacity. */
      --glow-rx: 1493px;
      --glow-height: 453px;
      --glow: radial-gradient(
        ellipse var(--glow-rx) var(--glow-height) at 50% 100%,
        color-mix(in oklch, #b84796 11%, transparent) 0%,
        color-mix(in oklch, #903775 11%, transparent) 25%,
        color-mix(in oklch, #682754 11%, transparent) 50%,
        color-mix(in oklch, #3f1833 11%, transparent) 75%,
        color-mix(in oklch, #2b1022 11%, transparent) 87.5%,
        transparent 100%
      );
    }
  }

  /* Mobile frames (375px) use a 327px-wide glow, 470px tall in light. */
  @media (max-width: 600px) {
    :root { --glow-rx: 327px; --glow-height: 470px; }
  }
  @media (max-width: 600px) and (prefers-color-scheme: dark) {
    :root { --glow-height: 453px; }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 52px 16px 64px;
    font-family: var(--sans-serif);
    font-feature-settings: "ss02" 1, "ss05" 1, "lnum" 1, "tnum" 1;
    font-variation-settings: "slnt" 0;
    color: var(--text-1);
    background-color: var(--bg-2);
    background-image: var(--glow);
    background-repeat: no-repeat;
    background-size: 100% var(--glow-height);
    background-position: bottom;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 180px;
    width: min(439px, 100%);
    margin-inline: auto;
  }

  .logo {
    display: block;
    color: var(--text-1);
  }

  .logo svg {
    display: block;
    width: 159px;
    height: 26px;
    overflow: visible;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 52px;
    width: 100%;
    text-align: center;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    width: min(271px, 100%);
  }

  .tile {
    position: relative;
    display: grid;
    place-items: center;
    width: 62px;
    height: 62px;
    border: 1px solid var(--tile-border);
    border-radius: 4px;
    background: var(--tile-bg);
    color: var(--text-3);
  }

  .tile > svg { width: 32px; height: 32px; }

  /* Figma places the badge at 44px from the tile's outer edge; offsets here
     are from the padding box, inside the 1px border. */
  .tile .badge {
    position: absolute;
    left: 43px;
    top: 43px;
    width: 24px;
    height: 24px;
  }

  .content {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 300;
    font-size: 28px;
    line-height: 32px;
    letter-spacing: -0.1px;
    text-wrap: balance;
  }

  p {
    margin: 0;
    color: var(--text-3);
    font-size: 17px;
    font-weight: 500;
    line-height: 22px;
    font-feature-settings: "ss05" 1, "lnum" 1, "tnum" 1;
  }

  .retry {
    padding-inline: 12px;
    color: var(--text-3);
    font-size: 13px;
    font-weight: 400;
    line-height: 16px;
    letter-spacing: 0.3px;
  }

  code {
    display: inline-block;
    margin-inline: 1px;
    padding: 1px 6px 2px;
    border-radius: 6px;
    background: var(--code-bg);
    font-family: var(--monospace);
    font-size: 13px;
    line-height: 16px;
    letter-spacing: 0;
    font-feature-settings: "ss05" 1, "lnum" 1, "pnum" 1;
    white-space: nowrap;
  }

  /* Short viewports (landscape phones): pull the card up under the logo. */
  @media (max-height: 560px) {
    body { padding-top: 32px; }
    .page { gap: 48px; }
    .card { gap: 32px; }
  }
</style>
</head>
