name: Set up tools
description: >-
  Install the Rust toolchain that rust-toolchain.toml pins and restore the cargo cache. Install mise,
  checked against a SHA-256 for the runner platform, and the mise.toml tools at
  the versions in mise.lock, which mise-action caches. Every later step finds
  the tools on PATH, from any directory. Check out the repository first.
inputs:
  targets:
    description: Extra Rust targets to install, separated by commas.
    default: ""
  components:
    description: Extra Rust components to install, separated by commas.
    default: ""
  cache:
    description: Set to "false" for a job that compiles nothing, or that holds a secret.
    default: "true"
  mise-tools:
    description: The mise.toml tools to install, separated by spaces. Empty installs them all.
    default: ""
  mise-cache:
    description: >-
      Set to "false" for a job that holds a secret. A tool restored from the cache skips the
      mise.lock checksum check.
    default: "true"
runs:
  using: composite
  steps:
    - id: toolchain
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # No other run can restore a cache saved on a queue entry's branch.
        save-if: ${{ github.event_name != 'merge_group' }}

    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: "2026.10.25"
        # The SHA-256 of the mise binary of that release, per runner platform.
        sha256: >-
          ${{ fromJSON('{
            "Linux-X64": "5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87",
            "macOS-ARM64": "8a3ef00765b009278197aba627ac00d6e9c63f6aeb04d4f4b2cfe0e59ddc2fd6",
            "macOS-X64": "e06eb3f0311dedbf65952ec2c0247398848653b302e6aad99d7371ad9ba33301"
          }')[format('{0}-{1}', runner.os, runner.arch)] }}
        # A shim works only below mise.toml, and tests run tools from
        # temporary directories. The next step puts the tools on PATH instead.
        add_shims_to_path: false
        install_args: ${{ inputs.mise-tools }}
        cache: ${{ inputs.mise-cache }}

    # The paths are mise's install directories for the tools that mise.toml
    # pins, so they are only as trusted as the checked-out repository.
    - name: Put the mise tools on PATH
      shell: bash
      run: mise bin-paths >> "$GITHUB_PATH" # zizmor: ignore[github-env]
