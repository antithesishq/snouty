# Proper names that the doc_markdown lint would otherwise want in backticks.
# ".." keeps clippy's default list.
doc-valid-idents = ["..", "DBus", "IdP", "OpenAPI", "SELinux"]

# A `BrokenPipe` from these streams carries no mark of where it came from, so
# `suppress_broken_pipe` in main.rs cannot tell it from a child's stdin or a
# socket. The wrappers in src/stdio.rs add that mark.
disallowed-methods = [
  { path = "std::io::stdout", reason = "use snouty::stdio::stdout(), which marks a closed stdout" },
  { path = "std::io::stderr", reason = "use snouty::stdio::stderr(), which marks a closed stderr" },
]
