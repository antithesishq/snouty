# Which tests need a real container engine, and how the suite is scheduled.
#
# The `container` test group is the single definition of that set. CI splits the
# macOS work along it: the arm64 leg in build.yml takes everything else on every
# pull request, and the Intel leg in slow-tests.yml takes these after merge. That
# split exists because arm64 macOS cannot run `podman machine` at all — Apple's
# Virtualization Framework gives its guests no nested virtualization — so the
# engine-backed tests can only run on Intel, which is also the slow half. The
# Nix build sandbox has no engine either, so the check phase in package.nix runs
# everything outside the group.
#
# Select the two halves with `--filterset 'group(container)'` and
# `--filterset 'not group(container)'`. `group()` works only on the command
# line, which is why the set lives here rather than in a profile filter.
#
# The set names tests explicitly, so a newly added engine-backed test is not in
# it. That fails closed rather than silently: the arm64 job runs the new test,
# finds no engine, and `skip_or_fail` panics because CI is set. Add the test here
# when that happens. The shims in scripts/no-engine-shims deliberately do not
# weaken this — they answer only the two probes `snouty doctor` makes, and fail
# the `podman info` that resolves a runtime for the tests.
#
# The `qemu` group is the tests that boot a simulation environment ISO in real QEMU. They need
# QEMU and the ISO that `SNOUTY_TEST_ENVIRONMENT_ISO` names, so only the test-qemu
# job in slow-tests.yml runs them, through `mise run test:qemu`. Every other
# Linux run, and the Nix build sandbox, excludes the group.

[test-groups]
# Naming the group is the point; the cap is the default parallelism rather than
# a narrower limit, so grouping does not itself serialize these tests.
container = { max-threads = "num-cpus" }
qemu = { max-threads = "num-cpus" }

[[profile.default.overrides]]
filter = "binary_id(snouty::simulate_qemu)"
test-group = "qemu"

[[profile.default.overrides]]
filter = """
     test(=compose::tests::compose_config_resolves_env)
   + test(=compose::tests::compose_contents_apply_overlays)
   + test(=compose::tests::config_json_hermetic_env_keeps_only_antithesis_variables)
   + test(/^compose::tests::pin_images_/)
   + test(=container::tests::build_and_push_to_mock_registry)
   + test(=engines_push_with_the_registry_auth)
   + test(=engines_push_and_pull_through_the_helper)
   + test(/_engine_.*_specs$/)
"""
test-group = "container"
# These are the slowest tests in the suite by a wide margin, and nextest
# otherwise schedules them last: they sort into the `snouty::spec` binary, which
# comes after every unit-test binary. On the macOS Intel leg that put the 85s
# `podman_engine_launch_config_push_specs` at the very end of a 157s run, so the
# run was 72s of fast tests followed by an 85s tail that ran almost alone.
# Starting them first bounds the run by the slowest test instead.
priority = 100

# The slowest tests that do NOT need an engine, started first for the same
# reason.
#
# `spec_tests` drives every file in `specs/`. It is not in the group above
# because it needs a runtime to be *detected*, not to work — `specs/doctor.txt`
# asserts that `snouty doctor` exits zero while testing API connectivity, and
# doctor fails when it finds no engine. The shims in scripts/no-engine-shims
# answer that probe on the arm64 leg and in the Nix build sandbox.
[[profile.default.overrides]]
filter = """
     test(=a_long_call_reports_progress)
   + test(=spec_tests)
"""
priority = 100

# `spec_tests` runs each spec file on a thread of its own, so it counts as
# more than one test.
[[profile.default.overrides]]
filter = "test(=spec_tests)"
threads-required = 4
