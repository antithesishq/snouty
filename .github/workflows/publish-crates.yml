# Publishes the crates to crates.io, then lists `snouty mcp` in the MCP Registry.
#
# `release.yml` (generated by dist) calls this workflow, because
# `dist-workspace.toml` sets `publish-jobs = ["./publish-crates"]`. dist runs it
# only for real releases, after the artifacts build and the GitHub Release
# exists. `publish-prereleases = true` makes it run for `-rc.N` tags as well.
#
# Authentication uses crates.io Trusted Publishing: GitHub mints an OIDC token,
# crates.io exchanges it for a registry token that lives for the job, and the
# repository holds no long-lived `CARGO_REGISTRY_TOKEN` secret. crates.io reads
# the workflow filename from the OIDC `workflow_ref` claim, which names the
# entry-point workflow. Both crates must therefore list `release.yml` — not this
# file — as the workflow in their Trusted Publishing config, and name the
# `release` environment. crates.io attaches a config only to a crate that
# already exists, so a crate with no published version needs one manual
# `cargo publish` before this job can take it over.
name: Publish crates

on:
  workflow_call:
    # dist passes the release plan to every publish job. This job does not read
    # it, but the input must be declared for the call to be valid.
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: "ubuntu-24.04"
    # Hold the run here until a reviewer approves it.
    environment: release
    # release.yml grants the publish job `id-token: write` and
    # `packages: write`. A called workflow can only narrow that grant, so this
    # job keeps the OIDC permission it needs and drops the rest. `contents`
    # stays unset; the checkout below reads a public repository.
    permissions:
      "id-token": "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain that rust-toolchain.toml pins, and mcp-publisher. This
      # job holds secrets, so it restores nothing from the Actions cache.
      - uses: ./.github/actions/setup-tools
        with:
          cache: "false"
          mise-tools: "github:modelcontextprotocol/registry"
          mise-cache: "false"
      - name: Get a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # snouty-macros goes first. snouty pins it with `=`, so snouty cannot
          # build against the registry until that exact version is in the index.
          # `cargo publish` waits for the index before it returns, so the second
          # crate sees the first one's upload.
          for crate in snouty-macros snouty; do
            version=$(cargo pkgid -p "$crate" | sed 's/.*[@#]//')
            if cargo info --registry crates-io "$crate@$version" > /dev/null 2>&1; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done
      # Runs for -rc.N tags too, so an -rc.N becomes the registry's latest
      # version until the stable release. TODO: skip prereleases once the mcp
      # feature is stable. MCP_PRIVATE_KEY is a hex Ed25519 key.
      # Its public half is in the antithesis.com TXT record
      # `v=MCPv1; k=ed25519; p=...`.
      - name: Publish to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$version?include_deleted=true"; then
            echo "$name $version is already in the MCP Registry"
            exit 0
          fi
          mcp-publisher login dns --domain antithesis.com --private-key "$MCP_PRIVATE_KEY"
          # The registry reads the mcp-name line from the crate's README on
          # crates.io, which serves the new README some time after the upload.
          # Wait for it, so that the one publish fails only on a real error.
          readme="https://crates.io/api/v1/crates/snouty/$version/readme"
          for _ in $(seq 20); do
            curl -sfL -A "snouty-release (https://github.com/antithesishq/snouty)" "$readme" \
              | grep -qF "mcp-name: $name" && break
            sleep 15
          done
          mcp-publisher publish
