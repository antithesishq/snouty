name: "Weekly Audit"
on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string

