name: build

on:
  push:
    branches: ["main"]
  # No branch filter: a stacked pull request (base = another PR's branch) gets
  # the same gate as one that targets main.
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CLICOLOR: 0
  NO_COLOR: "1"
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  skip-check:
    runs-on: ubuntu-24.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          paths_ignore: '["**.md"]'
  checks:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    # The clippy action reports its findings as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # 1.5.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          check-args: --all-targets
          args: -D warnings

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Ruff format
        run: uv run --locked ruff format --check scripts

      - name: Ruff check
        run: uv run --locked ruff check scripts

      - name: Pyright
        run: uv run --locked pyright

      - name: Script tests
        working-directory: scripts
        run: uv run --locked python -m unittest discover -p 'test_*.py'
  # No skip-check condition: typos also checks the .md files that a docs-only
  # change edits, and skip-check skips such a change.
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Spell Check Repo
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
  zizmor:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Offline: the online audits ask the GitHub API about upstream tags and
      # advisories, so their result can change with no change here. For
      # example, dtolnay/rust-toolchain moves its v1 tag on each Rust release.
      - name: Audit the workflows
        run: uvx zizmor==1.31.1 --offline .
  actionlint:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The runner image has shellcheck, so actionlint also checks `run:` scripts.
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint"
  shellcheck:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pin a release instead of the runner's older preinstalled shellcheck.
      - name: Install shellcheck
        run: |
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball"
          mkdir -p "$HOME/.local/bin"
          mv "shellcheck-$SHELLCHECK_VERSION/shellcheck" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Shellcheck
        run: shellcheck --version && scripts/check-shell.sh
  test:
    runs-on: ${{ matrix.os }}
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    # Safety net so a wedged container op can't hang the runner for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: docker
          - os: ubuntu-latest
            runtime: podman
    env:
      SNOUTY_TEST_RUNTIME: ${{ matrix.runtime }}
      # The Linux release binaries are static musl builds, so test that target.
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ env.CARGO_BUILD_TARGET }}

      # musl-gcc compiles the vendored OpenSSL and mimalloc C sources.
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest

      # snouty always drives Docker Compose v2 via the `docker-compose` binary,
      # independent of the image runtime. The matrix exercises that binary
      # against both runtimes: docker, and podman (which docker-compose reaches
      # over podman's API socket via DOCKER_HOST). Each configure step pins the
      # runtime and ensures `docker-compose` is on PATH.
      - name: Configure Docker
        if: matrix.runtime == 'docker'
        run: |
          sudo rm -v -f "$(which podman)"
          sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Configure Podman
        if: matrix.runtime == 'podman'
        run: |
          # Remove docker so snouty auto-detects podman; docker-compose then
          # reaches podman over its API socket via DOCKER_HOST.
          sudo rm -v -f "$(which docker)"
          sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          systemctl --user start podman.socket

      - name: Runtime Info
        shell: bash
        run: |
          if [ "${{ matrix.runtime }}" = "docker" ]; then
            docker info
          else
            podman info
          fi
          docker-compose version

      # Pre-fetch every remote image and start the registry tests push to, so a
      # slow or rate-limited pull fails here rather than inside a test. No
      # tarball cache here: this step already finishes in 8 to 18 seconds.
      - name: Set up test images and registry
        shell: bash
        timeout-minutes: 10
        run: scripts/setup-test-images.sh "${{ matrix.runtime }}"

      - name: Test
        run: cargo nextest run

  # The macOS leg a pull request gets. arm64 macOS cannot run `podman machine`,
  # so the engine-backed tests run after merge in slow-tests.yml and every other
  # test runs here: no VM to provision, no images to fetch, and no engine to
  # install. This leg also builds snouty for Apple silicon, which nothing else
  # in CI does.
  test-macos-arm:
    runs-on: macos-15
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    # Compiling the crate is nearly all of this job, and the first run builds
    # for a new target with a cold cache. This is a safety net, not a budget.
    timeout-minutes: 25
    steps:
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest

      # `specs/doctor.txt` asserts that `snouty doctor` exits zero while testing
      # API connectivity, and doctor fails when it finds no container runtime.
      # A real one is impossible here, so these shims answer the two probes
      # doctor makes and fail every other call. That lets the whole `specs/`
      # suite run on this leg without pretending the engine works: the
      # engine-backed tests resolve a runtime with `podman info`, which the shim
      # fails, so they still refuse to run here. See scripts/macos-arm-shims.
      - name: Shim the container runtime probes
        run: echo "$GITHUB_WORKSPACE/scripts/macos-arm-shims" >> "$GITHUB_PATH"

      # There is deliberately no container engine here. A test that needs one
      # but is missing from the `container` group in .config/nextest.toml fails
      # this job rather than skipping quietly, because `skip_or_fail` panics
      # when CI is set. That is the intended way to find such a test.
      - name: Test
        run: cargo nextest run --filterset 'not group(container)'

  staging:
    runs-on: ubuntu-latest
    needs: skip-check
    # GitHub does not pass Actions secrets to a workflow that a fork's pull
    # request triggers, or that Dependabot triggers, so this job skips there.
    if: |
      needs.skip-check.outputs.should_skip != 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest

      # This job gates merges. A missing secret must fail the job, because a
      # check that does not run is worse than a check that fails.
      - name: Require tenant credentials
        env:
          TENANT: ${{ secrets.STAGING_ANTITHESIS_TENANT }}
          API_KEY: ${{ secrets.STAGING_ANTITHESIS_API_KEY }}
        run: |
          if [ -z "$TENANT" ] || [ -z "$API_KEY" ]; then
            echo "STAGING_ANTITHESIS_TENANT and STAGING_ANTITHESIS_API_KEY must be set as repository secrets" >&2
            exit 1
          fi

      - name: Spec tests against staging
        env:
          SNOUTY_STAGING: 1
          ANTITHESIS_TENANT: ${{ secrets.STAGING_ANTITHESIS_TENANT }}
          ANTITHESIS_API_KEY: ${{ secrets.STAGING_ANTITHESIS_API_KEY }}
          # No base URL. snouty resolves https://<tenant>.antithesis.com, which
          # is the address to test.
        run: cargo nextest run --test spec spec_tests

  # The check the main ruleset requires. It covers what a pull request gates on;
  # the macOS Intel and nix legs are too slow for that and run after merge, in
  # slow-tests.yml. Add each job that a pull request must pass to `needs`. The
  # script reads every job in `needs`, so it needs no edit.
  tests-passed:
    runs-on: ubuntu-latest
    needs:
      - skip-check
      - checks
      - typos
      - test
      - test-macos-arm
      - staging
      - zizmor
      - actionlint
      - shellcheck
    if: always()
    steps:
      - name: Verify every needed job
        env:
          SHOULD_SKIP: ${{ needs.skip-check.outputs.should_skip }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # A job may skip only when skip-check skips the change, or when it is
          # `staging` on a fork's pull request. A failure or a cancellation
          # still blocks the merge.
          failed=$(jq -r --arg skip "$SHOULD_SKIP" 'to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped"
                or ($skip != "true" and .key != "staging"))
            | "\(.key): \(.value.result)"' <<<"$NEEDS")

          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
