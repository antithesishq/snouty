name: staging

# The read-only spec suite against a real Antithesis tenant, on a timer.
#
# build.yml's `staging` job runs the same thing on every pull request and gates
# the merge, so this is not the primary signal. It exists because the failure it
# is best at catching — `src/openapi.json` drifting from what the API actually
# returns — originates outside this repo and does not wait for someone to open a
# PR. On a quiet week the scheduled run is the only thing that would notice.
on:
  schedule:
    # 07:00 UTC daily — after the nightly tenant activity has settled.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CLICOLOR: 0
  NO_COLOR: "1"
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  spec-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Nextest
        uses: taiki-e/install-action@cargo-nextest

      # Only the read-only specs run: `snouty runs …` and the doctor probes.
      # Every file that would mutate tenant state stops at its `[staging] skip`.
      - name: Spec tests against staging
        env:
          SNOUTY_STAGING: 1
          ANTITHESIS_TENANT: ${{ secrets.STAGING_ANTITHESIS_TENANT }}
          ANTITHESIS_API_KEY: ${{ secrets.STAGING_ANTITHESIS_API_KEY }}
          # No base URL: snouty resolves https://<tenant>.antithesis.com from the
          # tenant, which is the address this is meant to exercise.
        run: cargo nextest run --test spec spec_tests
