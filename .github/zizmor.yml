# zizmor (https://docs.zizmor.sh) audits the GitHub Actions workflows. CI runs
# it in the `zizmor` job of build.yml.
#
# zizmor has no setting that skips a whole file, so the two generated workflows
# are listed under every audit that zizmor 1.31.1 knows. Fix a finding in
# them through the generator, not by hand:
#
# - weekly-audit.lock.yml is compiled by gh-aw from weekly-audit.md. Change the
#   .md file and run `gh aw compile`.
# - release.yml is generated by dist from dist-workspace.toml. dist refuses to
#   release when the file differs from what it generates.
#
# When you bump zizmor, add any new audit to this list.
rules:
  adhoc-packages:
    ignore: &generated
      - weekly-audit.lock.yml
      - release.yml
  anonymous-definition:
    ignore: *generated
  archived-uses:
    ignore: *generated
  artipacked:
    ignore: *generated
  bot-conditions:
    ignore: *generated
  cache-poisoning:
    ignore:
      - weekly-audit.lock.yml
      - release.yml
      # zizmor treats a push to a release branch as a release. slow-tests.yml
      # only runs tests there; it publishes nothing a poisoned cache could
      # reach.
      - slow-tests.yml
  concurrency-limits:
    ignore: *generated
  dangerous-triggers:
    ignore: *generated
  dependabot-cooldown:
    ignore: *generated
  dependabot-execution:
    ignore: *generated
  excessive-permissions:
    ignore: *generated
  forbidden-uses:
    ignore: *generated
  github-app:
    ignore: *generated
  github-env:
    ignore: *generated
  hardcoded-container-credentials:
    ignore: *generated
  impostor-commit:
    ignore: *generated
  insecure-commands:
    ignore: *generated
  insecure-url-scheme:
    ignore: *generated
  known-vulnerable-actions:
    ignore: *generated
  misfeature:
    ignore: *generated
  obfuscation:
    ignore: *generated
  overprovisioned-secrets:
    ignore: *generated
  ref-confusion:
    ignore: *generated
  ref-version-mismatch:
    ignore: *generated
  secrets-inherit:
    ignore: *generated
  secrets-outside-env:
    ignore: *generated
  self-hosted-runner:
    ignore: *generated
  self-repository:
    ignore: *generated
  stale-action-refs:
    ignore: *generated
  superfluous-actions:
    ignore: *generated
  template-injection:
    ignore: *generated
  typosquat-uses:
    ignore: *generated
  undocumented-permissions:
    ignore: *generated
  unpinned-images:
    ignore: *generated
  unpinned-tools:
    ignore: *generated
  unpinned-uses:
    ignore: *generated
  unredacted-secrets:
    ignore: *generated
  unsound-condition:
    ignore: *generated
  unsound-contains:
    ignore: *generated
  unsound-ternary:
    ignore: *generated
  use-trusted-publishing:
    ignore: *generated
