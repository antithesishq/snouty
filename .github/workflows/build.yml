name: build

on:
  push:
    branches: ["main"]
  # No branch filter: a stacked pull request (base = another PR's branch) gets
  # the same gate as one that targets main.
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CLICOLOR: 0
  NO_COLOR: "1"
  RUST_BACKTRACE: 1

permissions:
  contents: read
  checks: write

jobs:
  skip-check:
    runs-on: ubuntu-24.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5
        with:
          paths_ignore: '["**.md"]'
  checks:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Spell Check Repo
        uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2
  test:
    runs-on: ${{ matrix.os }}
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    # Safety net so a wedged container op can't hang the runner for hours.
    # macOS gets a bigger budget: it must exceed the sum of its step timeouts
    # below, or it fires first and hides which step stalled.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: docker
            timeout: 20
            filter: all()
          - os: ubuntu-latest
            runtime: podman
            timeout: 20
            filter: all()
          # Intel, because arm64 macOS cannot run `podman machine` at all:
          # Apple's Virtualization Framework gives its guests no nested
          # virtualization. So this leg runs only the engine-backed tests, and
          # `test-macos-arm` runs every other test on the free arm64 runner.
          #
          # Not the 12-core `macos-15-large`. Measured against this runner on
          # the same commit it was slower everywhere: `podman machine start`
          # took 166s against 90s, and every engine-backed test took 1.5x to
          # 2.5x longer. Its Xeon W cores are slower per core, and this work is
          # serial — boot a VM, then run tests that block on that VM — so more
          # cores buy nothing. It also bills per minute on a public repository.
          - os: macos-15-intel
            runtime: podman
            timeout: 35
            filter: group(container)
    env:
      SNOUTY_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Nextest
        uses: taiki-e/install-action@cargo-nextest

      # snouty always drives Docker Compose v2 via the `docker-compose` binary,
      # independent of the image runtime. The matrix exercises that binary
      # against both runtimes: docker on Ubuntu, and podman (which docker-compose
      # reaches over podman's API socket via DOCKER_HOST) on Ubuntu and macOS.
      # Each configure step pins the runtime and ensures `docker-compose` is on
      # PATH.
      - name: Configure Docker (Ubuntu)
        if: matrix.runtime == 'docker' && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo rm -v -f "$(which podman)"
          sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Configure Podman (Ubuntu)
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'ubuntu')
        run: |
          # Remove docker so snouty auto-detects podman; docker-compose then
          # reaches podman over its API socket via DOCKER_HOST.
          sudo rm -v -f "$(which docker)"
          sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          systemctl --user start podman.socket

      - name: Install Podman + docker-compose (macOS)
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
        shell: bash
        timeout-minutes: 8
        run: |
          # Time each portion so we can see where setup spends its time.
          t=$SECONDS
          # podman 6.0.0 dropped Intel macOS support, so `brew install podman`
          # no longer yields a working amd64 binary on this runner. Install the
          # last Intel-capable release (5.8.4) from its macOS pkg instead; still
          # get docker-compose from brew.
          brew install docker-compose
          curl -fsSL -o /tmp/podman-installer.pkg \
            https://github.com/podman-container-tools/podman/releases/download/v5.8.4/podman-installer-macos-amd64.pkg
          sudo installer -pkg /tmp/podman-installer.pkg -target /
          # The pkg installs the CLI under /opt/podman/bin, for this step and
          # every step after it.
          echo "/opt/podman/bin" >> "$GITHUB_PATH"
          export PATH="/opt/podman/bin:$PATH"

          printf '[timing] install: %ss\n' "$(( SECONDS - t ))"
          echo "::notice title=podman install timing::install $(( SECONDS - t ))s"

      # `podman machine init`/`start` have no timeout of their own and sometimes
      # wedge. Its own step bounds that hang and names it; healthy runs take
      # ~5m, so 8m is headroom.
      - name: Provision podman machine (macOS)
        id: podman_machine
        if: matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
        shell: bash
        timeout-minutes: 8
        continue-on-error: true
        run: scripts/provision-podman-machine.sh

      # A wedged start clears on a fresh machine, so retry once. A second step
      # gives the retry its own timeout, and no `continue-on-error` here means a
      # second failure fails the job.
      - name: Recreate podman machine after a failed start (macOS)
        if: |
          matrix.runtime == 'podman' && startsWith(matrix.os, 'macos')
          && steps.podman_machine.outcome == 'failure'
        shell: bash
        timeout-minutes: 8
        run: |
          echo "::warning title=podman machine retry::provisioning did not finish in time; recreating the machine"
          # The machine may be half-built or unresponsive, and neither teardown
          # step is required to succeed for a fresh init to work.
          podman machine stop || true
          podman machine rm --force || true
          scripts/provision-podman-machine.sh

      - name: Runtime Info
        shell: bash
        run: |
          if [ "${{ matrix.runtime }}" = "docker" ]; then
            docker info
          else
            podman info
          fi
          docker-compose version

      # Cache every test image as a tarball, so the run loads them from disk
      # instead of pulling them. `snouty validate` (k8s) does a `podman run`
      # that implicitly pulls k8s-validator with no timeout, and on macOS every
      # pull crosses the VM's gvproxy network proxy — under the parallel spec
      # run several tests can saturate it at once, and a pull that does wedges
      # indefinitely. Loading from a local tarball removes that failure mode,
      # and GitHub's cache has far better tail latency than Docker Hub or quay.
      # macOS only: on Linux this step already finishes in 8 to 18 seconds.
      #
      # The key tracks the script, so editing its image list re-primes the
      # cache without anyone having to remember to bump a version.
      - name: Cache test images (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/test-images
          key: test-images-${{ matrix.runtime }}-${{ hashFiles('scripts/setup-test-images.sh') }}

      # Pre-fetch every remote image and start the registry tests push to, so a
      # slow or rate-limited pull fails here rather than inside a test.
      - name: Set up test images and registry
        shell: bash
        timeout-minutes: 10
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export SNOUTY_TEST_IMAGE_CACHE="$HOME/test-images"
          fi
          scripts/setup-test-images.sh "${{ matrix.runtime }}"

      - name: Test
        run: cargo nextest run --filterset '${{ matrix.filter }}'

  # The other half of the macOS split. arm64 macOS cannot run `podman machine`,
  # so the engine-backed tests stay on the Intel leg in `test` above and every
  # other test runs here: no VM to provision, no images to fetch, and no engine
  # to install. This leg also builds snouty for Apple silicon, which nothing
  # else in CI does.
  test-macos-arm:
    runs-on: macos-15
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    # Compiling the crate is nearly all of this job, and the first run builds
    # for a new target with a cold cache. This is a safety net, not a budget.
    timeout-minutes: 25
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Nextest
        uses: taiki-e/install-action@cargo-nextest

      # There is deliberately no container engine here. A test that needs one
      # but is missing from the `container` group in .config/nextest.toml fails
      # this job rather than skipping quietly, because `skip_or_fail` panics
      # when CI is set. That is the intended way to find such a test.
      - name: Test
        run: cargo nextest run --filterset 'not group(container)'

  staging:
    runs-on: ubuntu-latest
    needs: skip-check
    # GitHub does not pass secrets to a workflow that a fork's pull request
    # triggers, so this job skips there.
    if: |
      needs.skip-check.outputs.should_skip != 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install Nextest
        uses: taiki-e/install-action@cargo-nextest

      # This job gates merges. A missing secret must fail the job, because a
      # check that does not run is worse than a check that fails.
      - name: Require tenant credentials
        env:
          TENANT: ${{ secrets.STAGING_ANTITHESIS_TENANT }}
          API_KEY: ${{ secrets.STAGING_ANTITHESIS_API_KEY }}
        run: |
          if [ -z "$TENANT" ] || [ -z "$API_KEY" ]; then
            echo "STAGING_ANTITHESIS_TENANT and STAGING_ANTITHESIS_API_KEY must be set as repository secrets" >&2
            exit 1
          fi

      - name: Spec tests against staging
        env:
          SNOUTY_STAGING: 1
          ANTITHESIS_TENANT: ${{ secrets.STAGING_ANTITHESIS_TENANT }}
          ANTITHESIS_API_KEY: ${{ secrets.STAGING_ANTITHESIS_API_KEY }}
          # No base URL. snouty resolves https://<tenant>.antithesis.com, which
          # is the address to test.
        run: cargo nextest run --test spec spec_tests

  tests-passed:
    runs-on: ubuntu-latest
    needs:
      - skip-check
      - test
      - test-macos-arm
      - build-nix
      - staging
    if: always()
    steps:
      - name: Verify test matrix
        run: |
          if [ "${{ needs.skip-check.outputs.should_skip }}" = "true" ]; then
            exit 0
          fi

          # `staging` skips on a fork's pull request. This gate accepts that
          # one result. A failure or a cancellation still blocks the merge.
          staging="${{ needs.staging.result }}"

          if [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.test-macos-arm.result }}" = "success" ] \
            && [ "${{ needs.build-nix.result }}" = "success" ] \
            && { [ "$staging" = "success" ] || [ "$staging" = "skipped" ]; }; then
            exit 0
          fi

          echo "test matrix result: ${{ needs.test.result }}"
          echo "test-macos-arm result: ${{ needs.test-macos-arm.result }}"
          echo "build-nix result: ${{ needs.build-nix.result }}"
          echo "staging result: $staging"
          exit 1
  build-nix:
    runs-on: ubuntu-latest
    needs: skip-check
    if: needs.skip-check.outputs.should_skip != 'true'
    steps:
      - uses: samueldr/lix-gha-installer-action@7b7f14d320d6aacfb65bd1ef761566b3b69e474c # v2026-02-22

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          persist-credentials: false

      - name: Start Podman socket # required for docker-compose
        run: |
          systemctl --user start podman.socket

      # This leg sets no SNOUTY_TEST_RUNTIME, so the suite exercises both
      # engines and both need the images.
      - name: Set up test images and registry
        shell: bash
        timeout-minutes: 10
        run: scripts/setup-test-images.sh podman docker

      - name: Build
        run: nix-build

      - name: Test
        run: nix-shell --run "cargo nextest run"
