[package]
name = "snouty"
version = "0.7.0-rc.2"
edition = "2024"
description = "A CLI tool for using the Antithesis API"
license = "Apache-2.0"
repository = "https://github.com/antithesishq/snouty"
default-run = "snouty"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
getrandom = "0.3"
env_logger = "0.11"
form_urlencoded = "1"
# pinned: alpha API churn between releases
http-cache-reqwest = "=1.0.0-alpha.6"
json5 = "1.3.0"
json-patch = "4"
jsonschema = { version = "0.37.4", default-features = false }
log = "0.4"
open = "5"
progenitor-client = "0.14.0"
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "json", "query", "stream", "native-tls-vendored"] }
reqwest-middleware = "0.5"
color-eyre = { version = "0.6", default-features = false }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "io-std", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip makes serde_json's f64 parsing correctly-rounded, so a vtime
# read out of a JSON number is never off by one ULP (see src/vtime.rs).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The float printer serde_json itself uses; VTime::Display goes through it so
# the human text matches the JSON number byte-for-byte (see src/vtime.rs).
zmij = "1"
indexmap = { version = "2.10.0" }
rusqlite = { version = "0.34", features = ["bundled"] }
console = "0.15"
tempfile = "3"
pulldown-cmark = "0.13"
libc = "0.2"
regex = "1"
semver = "1"
ptree = { version = "0.5.2", default-features = false }
serde_yaml = "0.9"
toml = "1.1.2"
http = "1.4.2"
which = "8"
keyring-core = "1.0.0"
textwrap = { version = "0.16.2", default-features = false }
sha2 = "0.10"
# Only the crossterm backend: the default `fuzzy` filter (fuzzy-matcher) is
# pointless for a three-entry menu, and the `macros`/`one-liners` sugar is unused.
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = [ "keychain" ] }

[[example]]
name = "mock_api"
path = "examples/mock_api.rs"

[build-dependencies]
# Same openapiv3 version progenitor resolves; build.rs preprocesses the spec
# through this type before handing it to the generator.
openapiv3 = "2"
prettyplease = "0.2"
progenitor = "0.14.0"
quote = "1"
# Same schemars version progenitor/typify resolve; build.rs hands
# with_conversion a schemars SchemaObject to map vtime onto crate::vtime::VTime.
schemars = "0.8"
serde_json = "1"
syn = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
# The antithesishq fork: explicit regex matching, Go-aligned regex flags, and
# a condition on a negated line skips instead of failing. Point back at
# crates.io when upstream ships these
# (https://github.com/antithesishq/testscript-rs).
testscript-rs = { git = "https://github.com/antithesishq/testscript-rs.git", branch = "main" }
ctor = "0.4"
wiremock = "0.6"
hegeltest = "0.21.2"
expectrl = "0.9"
strip-ansi-escapes = "0.2.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
