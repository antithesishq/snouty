[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = true
# Publish the crates to crates.io from CI (.github/workflows/publish-crates.yml)
publish-jobs = ["./publish-crates"]
# Publish -rc.N tags to crates.io as well as stable tags
publish-prereleases = true
# Produce build provenance attestations for the released artifacts
github-attestations = true

# dist defaults to macos-14, which GitHub retires on 2026-11-02.
# dist defaults Linux to ubuntu-22.04, which GitHub retires before 2027-04-17.
[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-24.04"

# Docker and Podman run the credential helper as docker-credential-snouty.
# The shell installer makes the alias as a symlink to snouty; the archives do
# not contain it.
[dist.bin-aliases]
snouty = ["docker-credential-snouty"]
