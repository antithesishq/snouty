[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = true
# Publish the crates to crates.io from CI (.github/workflows/publish-crates.yml)
publish-jobs = ["./publish-crates"]
# Publish -rc.N tags to crates.io as well as stable tags
publish-prereleases = true
# Produce build provenance attestations for the released artifacts
github-attestations = true
# Extra build-local-artifacts steps. The path is relative to .github/workflows.
github-build-setup = "../build-setup.yml"

# dist defaults to macos-14, which GitHub retires on 2026-11-02.
# The gnu binaries link against the build glibc, and the dist installer
# requires that version or newer. The manylinux_2_28 containers hold that
# floor at 2.28 on any runner image. dist runs inside the container, and its
# gnu build may need a newer glibc than the image has, so host selects its
# musl build.
[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-24.04"

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[dist.dependencies.apt]
musl-tools = { targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"] }
