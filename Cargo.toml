[workspace]
members = ["snouty-macros"]

# Both crates inherit this. It is the minor version of the toolchain that
# rust-toolchain.toml pins, which CI and the release builds use.
[workspace.package]
rust-version = "1.99"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The snouty library serves only its own binary and tests: #[must_use] on
# every getter is noise, and no one reads its rustdoc.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Long functions such as the clap dispatch in main read best in one piece.
too_many_lines = "allow"
# The fix, assert_eq!(x, [] as [T; 0]), is harder to read than the assert.
assert_is_empty = "allow"
# Most long literals are copied from real API payloads; separators hide that.
unreadable_literal = "allow"
# The numeric casts convert vtimes, durations and sizes, whose values stay far
# inside the range of both types.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[lints]
workspace = true

[package]
name = "snouty"
version = "0.9.0-rc.2"
edition = "2024"
rust-version.workspace = true
description = "A CLI tool for using the Antithesis API"
license = "Apache-2.0"
repository = "https://github.com/antithesishq/snouty"
default-run = "snouty"

[dependencies]
base64 = "0.23"
bytesize = "2"
# tokio-runtime instead of the default async-std. No mmap: cacache uses it only
# to write small entries, and it pulls in memmap2 0.5 (RUSTSEC-2026-0186).
cacache = { version = "13", default-features = false, features = ["tokio-runtime"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
getrandom = "0.4"
env_logger = { version = "0.11", default-features = false }
form_urlencoded = "1"
headers = "0.4"
hyper = "1"
# `snouty mcp`: the MCP server, on the stdio transport.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
json-patch = "4"
jsonschema = { version = "0.60", default-features = false }
log = "0.4"
open = "5"
progenitor-client = "0.15.0"
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "json", "query", "stream", "rustls-no-provider"] }
# ring makes a smaller binary than reqwest's default, aws-lc-rs.
# api::client_builder installs it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
color-eyre = { version = "0.6", default-features = false }
futures-util = "0.3"
# Chunk type of reqwest response streams; JsonStream buffers them.
bytes = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "io-std", "net", "signal", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
serde = { version = "1", features = ["derive"] }
# The exact-version pin keeps a crates.io build of snouty on the macro
# crate published for this exact release (the serde/serde_derive pattern).
snouty-macros = { path = "snouty-macros", version = "=0.9.0-rc.2" }
# float_roundtrip makes serde_json's f64 parsing correctly-rounded, so a vtime
# read out of a JSON number is never off by one ULP (see src/vtime.rs).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The float printer serde_json itself uses; VTime::Display goes through it so
# the text output matches the JSON number byte-for-byte (see src/vtime.rs).
zmij = "1"
indexmap = { version = "2.10.0" }
# No default features: snouty never caches statements (cache), and does not
# target wasm (ffi-sqlite-wasm-rs).
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
console = "0.16"
indicatif = "0.18"
tempfile = "3"
pulldown-cmark = "0.13"
libc = "0.2"
regex = "1"
semver = "1"
shlex = "2"
ptree = { version = "0.5.2", default-features = false }
serde_yaml = "0.9"
toml = "1.1.2"
http = "1.4.2"
which = "8"
keyring-core = "1.0.0"
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-width"] }
indoc = "2.0.7"
sha2 = "0.10"
# Only the crossterm backend: the default `fuzzy` filter (fuzzy-matcher) is
# pointless for a three-entry menu, and the `macros`/`one-liners` sugar is unused.
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
# `config` reads askama.toml, at build time only.
askama = { version = "0.16.1", default-features = false, features = ["config", "derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
gix = { version = "0.90", default-features = false, features = ["sha1"] }

# See the global_allocator in main.rs.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[[example]]
name = "mock_api"
path = "examples/mock_api.rs"

[build-dependencies]
# Same openapiv3 version progenitor resolves; build.rs preprocesses the spec
# through this type before handing it to the generator.
openapiv3 = "2"
prettyplease = "0.3.0"
progenitor = "0.15.0"
quote = "1"
# Same schemars version progenitor/typify resolve; build.rs hands
# with_conversion a schemars SchemaObject to map vtime onto crate::vtime::VTime.
schemars = "0.8"
serde_json = "1"
syn = "3.0.6"

[dev-dependencies]
# An MCP client that drives `snouty mcp` in tests/mcp.rs.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
# Snapshot tests of the rendered help pages (tests/help_snapshots.rs).
insta = "1"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
# The antithesishq fork: explicit regex matching, Go-aligned regex flags, and
# a condition on a negated line skips instead of failing. TODO: point back at
# crates.io when upstream ships these
# (https://github.com/antithesishq/testscript-rs).
testscript-rs = { git = "https://github.com/antithesishq/testscript-rs.git", branch = "main" }
ctor = "1"
wiremock = "0.6"
hegeltest = { version = "0.50.3", features = ["static-engine"] }
expectrl = "0.9"
strip-ansi-escapes = "0.2.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
