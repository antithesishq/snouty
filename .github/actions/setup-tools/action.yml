name: Set up tools
description: >-
  Install the stable Rust toolchain and restore the cargo cache. Install mise,
  checked against a SHA-256 for the runner platform, and the mise.toml tools at
  the versions in mise.lock, which mise-action caches. Every later step finds
  the tools on PATH, from any directory. Check out the repository first.
inputs:
  targets:
    description: Extra Rust targets to install, separated by commas.
    default: ""
  components:
    description: Extra Rust components to install, separated by commas.
    default: ""
  cache:
    description: Set to "false" for a job that compiles nothing.
    default: "true"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: "2026.10.7"
        # The SHA-256 of the mise binary of that release, per runner platform.
        sha256: >-
          ${{ fromJSON('{
            "Linux-X64": "6eb1b890e90818417ca34c90dbbd47881917d5cd199f31b63b062ea9c6b18d85",
            "macOS-ARM64": "f5171e341518a57e8c4e9280e28443e35d66212c51164c83be76794e0a78b014",
            "macOS-X64": "c3355f0c56d1b9fe73a2ba30e034b4e483541b25b1ad812a87440abfaeec8baa"
          }')[format('{0}-{1}', runner.os, runner.arch)] }}
        # A shim works only below mise.toml, and tests run tools from
        # temporary directories. The next step puts the tools on PATH instead.
        add_shims_to_path: false

    # The paths are mise's install directories for the tools that mise.toml
    # pins, so they are only as trusted as the checked-out repository.
    - name: Put the mise tools on PATH
      shell: bash
      run: mise bin-paths >> "$GITHUB_PATH" # zizmor: ignore[github-env]
